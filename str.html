<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0f1d" />
<link rel="manifest" href="/manifest-str.webmanifest" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<title>SYBNB Stays</title>
<style>
*{box-sizing:border-box}body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#0a0f1d;color:#eef1f8}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:8px}header>span{display:flex;gap:12px;align-items:center}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:0}main{padding:8px 16px 32px;max-width:560px;margin:0 auto;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:15px}input,select,button,.btn{font:inherit;min-height:48px;border-radius:12px;border:1px solid #33405e;background:#141b2e;color:inherit;padding:8px 14px}
button.primary,.btn.primary{background:#2f6bff;border-color:#2f6bff;font-weight:600;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
button.link{background:none;border:0;color:#8fb0ff;min-height:44px;padding:0 6px}.big{font-size:20px;font-weight:600;margin:0}p{margin:0}
.msg{padding:10px 12px;border-radius:10px}.msg.err{background:#4a1d27}.msg.info{background:#1c2a4a}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px}.chip{white-space:nowrap;min-height:40px}.chip.on{background:#2f6bff;border-color:#2f6bff}
.card{display:flex;gap:12px;padding:12px;border:1px solid #26314d;border-radius:14px;background:#10172a}.card img{width:96px;height:72px;object-fit:cover;border-radius:8px}
.hero{width:100%;height:auto;border-radius:12px}.chk{display:flex;align-items:center;gap:6px;font-size:14px}.chk input{min-height:0;width:20px;height:20px}
form{display:grid;gap:12px}main>button,form>button{width:100%}
.code{font-size:28px;letter-spacing:4px;margin-inline-start:8px}.desc{white-space:pre-wrap;color:#c3cbe0}
</style>
</head>
<body>
<div id="app"><p style="padding:16px">…</p></div>
<script type="module" src="/src/lite/str.ts"></script>
</body>
</html>
