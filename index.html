<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1d" />
    <!--
      Baseline frontend CSP (see docs/security/SYBNB_V6_FRONTEND_CSP_PLAN.md for the full design,
      what this does and does not cover, and what production hosting still has to add).

      This is a real, working, locally-testable policy — not a placeholder — but a <meta> CSP has
      hard limits the eventual production static host/CDN must still close:
        - frame-ancestors is silently ignored by browsers when delivered via <meta> (CSP spec);
          clickjacking protection for the frontend still requires a real HTTP header from
          whatever serves the built files in production. EXTERNAL INFRASTRUCTURE REQUIRED.
        - connect-src below only lists the known local API ports (dev + isolated test); a real
          deployment must add its actual API origin here (or move this policy to a response
          header the host controls, which can be templated per-environment; a static <meta> tag
          cannot). OWNER DECISION REQUIRED once a production API origin exists.
        - style-src needs 'unsafe-inline': this codebase applies React inline `style={}` props
          extensively (not a small number of components) — removing this would require a broader
          refactor to CSS classes/modules, out of scope for this fix. Documented as an accepted,
          narrower-than-ideal trade-off, not hidden.
      script-src has no 'unsafe-inline'/'unsafe-eval': the production build (`vite build`) emits
      only external <script src> files, no inline scripts — verified directly against dist/.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:3051 http://127.0.0.1:3061; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <title>SYBNB V6</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
