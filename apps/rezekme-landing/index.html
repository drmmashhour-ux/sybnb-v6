<style>
:root{--green:#14261f;--green2:#1e3a2f;--coral:#e07a52;--gold:#e0b66f;--cream:#f8f4ec;--sand:#ece3d0;--ink:#1e3a2f;--muted:#5d6b63}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5}

.serif{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;color:var(--gold)}

nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0;flex-wrap:wrap}

.pill{background:#fff;color:var(--green);padding:12px 24px;border-radius:999px;font-weight:700}
.hero{padding:72px 0 140px;position:relative;overflow:hidden}

.eyebrow{display:flex;gap:16px;align-items:center;color:var(--gold);font-weight:700;letter-spacing:.2em;font-size:13px;text-transform:uppercase}

h1{font-size:clamp(44px,8vw,96px);line-height:.98;letter-spacing:-.04em;margin:24px 0 24px;font-weight:700;max-width:760px}
.lead{font-size:20px;color:#d9e3dc;max-width:560px;margin:0}

.tabs{display:flex;border-bottom:1px solid #e8e1d2}
.tabs button{all:unset;cursor:pointer;padding:22px 32px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--coral)}
.panel{display:flex;gap:24px;align-items:center;justify-content:space-between;padding:28px 32px;flex-wrap:wrap}

.cards{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{border-radius:28px;padding:40px;min-height:460px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}

.card span{font-weight:700;border-bottom:2px solid currentColor;align-self:flex-start}
.dark{background:var(--green);color:#fff}
.dark h2 .serif{display:block}
.rows{display:grid;gap:0;max-width:640px}
.row{padding:24px 0;border-top:1px solid rgba(255,255,255,.14)}
.row h3{margin:0 0 6px;font-size:20px}.row p{margin:0;color:#b9c9bf}
.split{display:grid;gap:56px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center}
.arch{height:520px;border-radius:220px 220px 24px 24px;background:url(img/pavilion.jpg) center/cover var(--gold)}.photo{height:520px;border-radius:28px;background:url(img/driver.jpg) center/cover var(--green2)}
.opts{display:grid;gap:16px;margin-top:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fffdf8;border:1.5px solid #e8e1d2;border-radius:18px;padding:22px 24px}
.opt:hover{border-color:var(--coral)}
.opt b{display:block;font-size:18px}.opt small{color:var(--muted)}
.faq{background:var(--sand)}
details{border-top:1px solid #d8cdb4;padding:20px 0}
summary{font-weight:700;font-size:19px;cursor:pointer}
details p{color:var(--muted);margin:10px 0 0}
footer{background:var(--green);color:#b9c9bf;padding:56px 0 32px}
.fgrid{display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap}
.fgrid a{display:block;margin:6px 0}
.fgrid h4{color:#fff;letter-spacing:.14em;font-size:12px;text-transform:uppercase;margin:0 0 12px}
.legal{border-top:1px solid rgba(255,255,255,.12);margin-top:40px;padding-top:20px;font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:700px){.links a:not(.pill){display:none}.tabs button{padding:18px 20px}}

.langs{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px}
.langs button{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;color:#fff;opacity:.75}
.langs button[aria-pressed=true]{background:#fff;color:var(--green);opacity:1}
.signin{position:relative}
.signin-menu{display:none;position:absolute;inset-inline-end:0;top:calc(100% + 8px);background:#fffdf8;color:var(--ink);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.25);padding:8px;min-width:220px;z-index:5}
.signin.open .signin-menu{display:grid}
.signin-menu a{padding:12px 14px;border-radius:10px;font-weight:700}
.signin-menu a:hover{background:var(--sand)}

.pay{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
[dir=rtl] body,[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{font-family:'Cairo','DM Sans',system-ui,sans-serif;letter-spacing:0}

</style>

var KEY='rezekme_landing_lang',lang='ar';
try{var q=new URLSearchParams(location.search).get('lang');var st=localStorage.getItem(KEY);lang=['ar','en','fr'].indexOf(q)>=0?q:['ar','en','fr'].indexOf(st)>=0?st:((navigator.language||'').slice(0,2)==='fr'?'fr':(navigator.language||'').slice(0,2)==='en'?'en':'ar')}catch(e){}
var ride=false;
function panel(){var d=T[lang];document.getElementById('t-ride').setAttribute('aria-selected',ride);document.getElementById('t-stay').setAttribute('aria-selected',!ride);document.getElementById('ptext').textContent=ride?d.p_ride:d.p_stay;var c=document.getElementById('pcta');c.textContent=ride?d.cta_ride:d.cta_stay;c.href=(ride?'https://rides.rezekme.com/':'https://stay.rezekme.com/')+'?lang='+lang}
function apply(l){lang=l;var d=T[l];document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
document.querySelectorAll('[data-i]').forEach(function(e){var v=d[e.getAttribute('data-i')];if(v!=null)e.textContent=v});
document.querySelectorAll('[data-ia]').forEach(function(e){e.setAttribute('aria-label',d[e.getAttribute('data-ia')]||'')});
document.querySelectorAll('a[data-l]').forEach(function(a){var u=new URL(a.getAttribute('href'),location.href);u.searchParams.set('lang',l);a.href=u.toString()});
document.querySelectorAll('.langs button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===l)});
document.querySelectorAll('.opt span[aria-hidden]').forEach(function(e){e.textContent=l==='ar'?'←':'→'});
document.title=l==='ar'?'Rezekme — رحلات وإقامات في سوريا':l==='fr'?'Rezekme — Courses et séjours en Syrie':'Rezekme — Rides and stays in Syria';
try{localStorage.setItem(KEY,l)}catch(e){};panel()}
document.querySelectorAll('.langs button').forEach(function(b){b.onclick=function(){apply(b.getAttribute('data-lang'))}});
document.getElementById('t-ride').onclick=function(){ride=true;panel()};document.getElementById('t-stay').onclick=function(){ride=false;panel()};
var si=document.getElementById('signin'),sb=document.getElementById('signin-btn');sb.onclick=function(e){e.stopPropagation();var o=si.classList.toggle('open');sb.setAttribute('aria-expanded',o)};document.addEventListener('click',function(){si.classList.remove('open');sb.setAttribute('aria-expanded','false')});
apply(lang);
})();
