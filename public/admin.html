<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Installable "SYBNB Admin" app (owner decision 2026-10-08). Its own manifest; the main site
         is unchanged. Opens the admin portal, which always asks for password + a fresh email code. -->
    <link rel="manifest" href="/manifest-admin.webmanifest" />
    <meta name="theme-color" content="#080a10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SYBNB Admin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/assets/logos/sybnb-arch-monogram.png" />
    <link rel="icon" type="image/png" href="/assets/logos/sybnb-arch-monogram.png" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SYBNB Admin</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #080a10; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      a { color: #9fb0ff; font-weight: 800; }
    </style>
    <script>
      // Go straight to the admin portal (hash route). replace() keeps the back button out of a loop.
      window.location.replace('/#/admin/review')
    </script>
  </head>
  <body>
    <main>
      <div>
        <img src="/assets/logos/sybnb-arch-monogram.png" alt="" />
        <p>SYBNB Admin…</p>
        <p><a href="/#/admin/review">فتح لوحة الإدارة / Open the admin panel</a></p>
      </div>
    </main>
  </body>
</html>
